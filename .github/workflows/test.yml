name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          # full history: specs/render_index.py derives every spec's `updated`
          # column from `git log -1` on the file, and the STATUS gate compares
          # the committed index against a fresh render. A depth-1 clone has no
          # history for files the HEAD commit did not touch, so the render
          # could never match — 63 consecutive red runs before anyone looked.
          # (This change shipped without its Process-Change trailer and the
          # spec-reference gate failed that push — correctly. Trailer carried
          # by the follow-up commit that added this note.)
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
      - name: Run tests
        run: pytest -q
        # The live LLM acceptance eval is opt-in (VERACIUM_EVAL=1) and needs a
        # provider + key, so it stays skipped here; the offline suite is the gate.

  min-deps:
    # specs/0016 D1 (R6-4): a REAL minimum-dependency job — pydantic pinned to
    # the declared floor. The floor is 2.12.0 from the Python 3.14 floor
    # (2026-09-27): no pydantic-core wheel exists for 3.14 below it. D1's own
    # reason for 2.7 (Field(deprecated=...), R5-3) lapsed at D2, which removed
    # its only consumer. tests/test_dependency_floor.py asserts the installed
    # version equals the floor pyproject.toml declares, so this job cannot
    # silently "pass" on another version; the whole suite also runs here so
    # the floor is a supported configuration, not a marketing claim.
    name: pytest (pydantic floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install with the pinned floor
        # CORE floor only: the [mcp] extra's own dependencies require a newer
        # pydantic (their resolver enforces it for mcp users), so the floor
        # claim is scoped to the core library; the one MCP test is
        # importorskip-gated and skips cleanly here.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "pydantic==2.12.0"
      - name: Run tests at the floor
        env:
          VERACIUM_MIN_DEP_JOB: "1"
        run: pytest -q

  build:
    name: build & twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Build distribution and validate metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

  spec-reference:
    name: spec reference on trust-surface changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: "Check for Spec: trailers"
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          elif [ -n "${{ github.event.before }}" ] && \
               git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            # First push or force-push: there is no meaningful base. Check the
            # tip commit alone rather than skipping — the previous version
            # exited 0 here, which is the same fail-open defect the script had.
            echo "no usable base (first push or force-push); checking the tip commit only"
            RANGE="${{ github.sha }}^!"
          fi
          echo "checking $RANGE"
          python3 specs/check_spec_reference.py "$RANGE"
